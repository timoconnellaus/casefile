# Desktop releases (ADR 24, docs/RELEASING.md). Every push to main that changes the app releases
# it, as the next version (scripts/release/next_version.ts: PATCH, or MINOR/MAJOR when a commit
# says [minor]/[major]):
#   build    (macOS): ci, build dist/casefile.app at that version, smoke-test it, zip it, make
#            update patches from the last three releases and check each rebuilds this runtime
#            exactly.
#   publish  (the `release` environment, the only job that can read the signing key; it waits for
#            approval if the environment has required reviewers): sign latest.json and publish the
#            GitHub release, which tags the commit. The app fetches latest.json from the latest
#            release and refuses it unless the signature is good.
# Nothing is released until the one-time setup has put the public key in update_config.ts.
name: release
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "deno.json"
      - "deno.lock"
      - "scripts/build_desktop.ts"
      - "scripts/release/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
permissions:
  contents: read
# One release at a time, in order; a push that arrives meanwhile waits (the latest one wins).
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.7
      - id: v
        run: |
          if grep -q 'UPDATE_PUBLIC_KEY: string | null = null' src/app/update_config.ts; then
            echo "::notice::Updates aren't set up yet (docs/RELEASING.md, one-time setup): not releasing."
            exit 0
          fi
          VERSION=$(deno run --allow-read --allow-run scripts/release/next_version.ts)
          [ -z "$VERSION" ] && echo "::notice::This commit is already released." && exit 0
          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    if: needs.version.outputs.version != ''
    # Namespace (namespace.so) Apple-silicon runner, profile "casefile-macos" (ADR 24 amendment).
    runs-on: namespace-profile-casefile-macos
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.7
      - name: Set the version
        run: |
          deno eval 'const p = "deno.json"; const j = JSON.parse(Deno.readTextFileSync(p)); j.version = Deno.args[0]; Deno.writeTextFileSync(p, JSON.stringify(j, null, 2) + "\n");' "$VERSION"
      - run: deno task ci
      - run: brew install bsdiff
      - run: deno task desktop
      # Deno's launcher can't roll back a version that fails to start (ADR 24), so a build that
      # doesn't start, or doesn't know its version, is never published.
      - name: Smoke test the app
        run: |
          T=$(mktemp -d); mkdir -p "$T/home" "$T/config"
          APP=dist/casefile.app/Contents/MacOS/laufey_webview
          HOME="$T/home" CASEFILE_CONFIG_DIR="$T/config" "$APP" > "$T/app.log" 2>&1 &
          PORT=""
          for i in $(seq 60); do
            sleep 2
            PID=$(pgrep -f "$APP" | head -1 || true)
            [ -n "$PID" ] && PORT=$(lsof -nP -a -p "$PID" -iTCP -sTCP:LISTEN 2>/dev/null | awk 'NR>1{print $9}' | sed 's/.*://' | head -1)
            [ -n "$PORT" ] && break
          done
          STATUS=$(curl -fsS "http://127.0.0.1:$PORT/api/status" || true)
          pkill -TERM -f "$APP" || true
          cat "$T/app.log"
          echo "$STATUS" | grep -q "\"version\":\"$VERSION\"" || { echo "The app did not start as $VERSION"; exit 1; }
      - name: Package
        run: |
          mkdir out
          ditto -c -k --keepParent dist/casefile.app out/casefile-macos-arm64.zip
      - name: Update patches
        run: >
          deno run --allow-read --allow-write --allow-run --allow-env scripts/release/patches.ts
          --version "$VERSION" --out out
          --dylib dist/casefile.app/Contents/MacOS/libruntime.dylib --keep 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: out/
          retention-days: 7
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: out
      - name: Sign latest.json
        env:
          CASEFILE_UPDATE_SIGNING_KEY: ${{ secrets.CASEFILE_UPDATE_SIGNING_KEY }}
        run: deno task release:manifest --version "$VERSION" --dir out $(cat out/patches.args)
      - name: Installer
        run: sed "s|__REPO__|${GITHUB_REPOSITORY}|" scripts/install.sh > out/install.sh
      - name: Publish
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "casefile $VERSION" --generate-notes \
            out/casefile-macos-arm64.zip out/latest.json out/install.sh $(ls out/patch-*.bin 2>/dev/null)

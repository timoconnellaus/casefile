name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Cache dependencies
        run: deno cache --frozen src/cli/main.ts src/app/main.ts scripts/seed.ts tests/*.ts
      - name: fmt check, lint, type check, tests
        run: deno task ci
